name: Atualizar índice de frases

on:
  push:
    branches: [main]
    paths:
      - "_frases/**"
      - ".github/action-test"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Gerar índice
        run: ruby scripts/build_phrases.rb

      - name: Guardar índice atualizado
        run: |
          if git diff --quiet -- data/phrases.json; then
            echo "Índice já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/phrases.json
          git commit -m "Atualizar índice de frases"
          git push
